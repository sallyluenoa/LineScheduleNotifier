ktor:
  application:
    modules:
      - org.fog_rock.lineschedulenotifier.ApplicationKt.module
  deployment:
    port: 8080
app:
  name: "LineScheduleNotifier"
  locale:
    language: "en"
  provider:
    secret_manager: "cloud"
    spreadsheet: "cloud"
    line_api: "cloud"
  google_cloud:
    project_number: ${PROJECT_NUMBER}
    credentials_key: "GOOGLE_API_CREDENTIALS"
  google_sheets:
    spreadsheet_id_key: "GOOGLE_SPREADSHEET_ID"
  line_bot:
    channel_access_token_key: "LINE_CHANNEL_ACCESS_TOKEN"
    channel_secret_key: "LINE_CHANNEL_SECRET"
